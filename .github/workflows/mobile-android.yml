name: Mobile Android (BrowserStack)

on:
  push:
    paths: ['mobile-tests/**', '.github/workflows/mobile-android.yml', '.github/actions/publish-allure/**', '.github/pages/**']
  pull_request:
    paths: ['mobile-tests/**', '.github/workflows/mobile-android.yml', '.github/actions/publish-allure/**', '.github/pages/**']
  workflow_dispatch:

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile-tests

jobs:
  android-browserstack:
    name: Android (BrowserStack - dispositivo real)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
    steps:
      - name: Verificar credenciais do BrowserStack
        run: |
          missing=()
          [ -z "$BROWSERSTACK_USERNAME" ] && missing+=(BROWSERSTACK_USERNAME)
          [ -z "$BROWSERSTACK_ACCESS_KEY" ] && missing+=(BROWSERSTACK_ACCESS_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Credenciais do BrowserStack ausentes::Cadastre ${missing[*]} em Settings > Secrets and variables > Actions > Secrets (Repository secrets)."
            exit 1
          fi
        working-directory: .
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-tests/package-lock.json
      - run: npm ci
      - run: ./scripts/download-apps.sh android
      - run: npm run test:browserstack:android
      - name: Publicar relatório Allure (Android)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-allure-android
          path: |
            mobile-tests/allure-report/
            mobile-tests/allure-results/
          retention-days: 14

  publicar-relatorio:
    # Publica o Allure no GitHub Pages a cada execução na main, mesmo com testes falhando
    # (as falhas documentam os defeitos da aplicação). Requer Settings > Pages > branch gh-pages.
    name: Publicar relatório no GitHub Pages
    needs: android-browserstack
    if: ${{ !cancelled() && needs.android-browserstack.result != 'skipped' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # As três suítes publicam no mesmo site: uma publicação por vez, sem cancelar as pendentes.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Baixar resultados da execução
        id: resultados
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: relatorio-allure-android
          path: artefato
      - name: Publicar relatório Allure
        if: ${{ steps.resultados.outcome == 'success' }}
        uses: ./.github/actions/publish-allure
        with:
          results-dir: artefato/allure-results
          folder: android
          report-name: Mobile Android - Toolshop (BrowserStack)
          github-token: ${{ secrets.GITHUB_TOKEN }}
