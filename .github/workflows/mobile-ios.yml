name: Mobile iOS (simulador)

on:
  push:
    paths: ['mobile-tests/**', '.github/workflows/mobile-ios.yml', '.github/actions/publish-allure/**', '.github/pages/**']
  pull_request:
    paths: ['mobile-tests/**', '.github/workflows/mobile-ios.yml', '.github/actions/publish-allure/**', '.github/pages/**']
  workflow_dispatch:

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile-tests

jobs:
  ios-simulator:
    # O build oficial do app iOS é somente para simulador, por isso não roda no BrowserStack
    # (que executa iOS apenas em aparelhos reais). Ver mobile-tests/README.md.
    name: iOS (simulador no runner macOS)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-tests/package-lock.json
      - run: npm ci
      - name: Instalar driver XCUITest do Appium
        run: APPIUM_HOME=.appium npx appium driver install xcuitest
      - run: ./scripts/download-apps.sh ios
      - name: Escolher e ligar um simulador de iPhone
        # As versões de iOS disponíveis variam com a imagem do runner: usa a mais recente instalada.
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | last')
          IOS_VERSION=$(echo "$RUNTIME" | jq -r '.version')
          RUNTIME_ID=$(echo "$RUNTIME" | jq -r '.identifier')
          IOS_DEVICE=$(xcrun simctl list devices available -j \
            | jq -r --arg rt "$RUNTIME_ID" '.devices[$rt][] | select(.name | startswith("iPhone")) | .name' \
            | grep -m1 -E 'Pro$' || true)
          if [ -z "$IOS_DEVICE" ]; then
            IOS_DEVICE=$(xcrun simctl list devices available -j \
              | jq -r --arg rt "$RUNTIME_ID" '[.devices[$rt][] | select(.name | startswith("iPhone"))][0].name')
          fi
          echo "Simulador: $IOS_DEVICE (iOS $IOS_VERSION)"
          echo "IOS_VERSION=$IOS_VERSION" >> "$GITHUB_ENV"
          echo "IOS_DEVICE=$IOS_DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$IOS_DEVICE" || true
          xcrun simctl bootstatus "$IOS_DEVICE" -b
      - run: npm run test:ios
      - name: Publicar relatório Allure (iOS)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-allure-ios
          path: |
            mobile-tests/allure-report/
            mobile-tests/allure-results/
          retention-days: 14

  publicar-relatorio:
    # Publica o Allure no GitHub Pages a cada execução na main, mesmo com testes falhando
    # (as falhas documentam os defeitos da aplicação). Requer Settings > Pages > branch gh-pages.
    name: Publicar relatório no GitHub Pages
    needs: ios-simulator
    if: ${{ !cancelled() && needs.ios-simulator.result != 'skipped' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # As três suítes publicam no mesmo site: uma publicação por vez, sem cancelar as pendentes.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Baixar resultados da execução
        id: resultados
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: relatorio-allure-ios
          path: artefato
      - name: Publicar relatório Allure
        if: ${{ steps.resultados.outcome == 'success' }}
        uses: ./.github/actions/publish-allure
        with:
          results-dir: artefato/allure-results
          folder: ios
          report-name: Mobile iOS - Toolshop (simulador)
          github-token: ${{ secrets.GITHUB_TOKEN }}
